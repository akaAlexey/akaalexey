name: Publish akaalexey personal website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-personal
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out personal repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Retrieve original personal website on first run
        if: ${{ hashFiles('site/build.py') == '' }}
        uses: actions/checkout@v4
        with:
          repository: Alex-Game-Lab/Alex-Game-Lab.github.io
          ref: main
          path: __original_website
          persist-credentials: false

      - name: Import source and publish ready-to-serve website files
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f site/build.py ]; then
            mkdir -p site
            cp -a __original_website/sites/akaalexey/. site/
          fi

          python3 - <<'PY'
          from pathlib import Path
          import json
          path = Path('site/site_config.json')
          config = json.loads(path.read_text(encoding='utf-8'))
          config['origins']['personal'] = 'https://akaalexey.ru'
          config['origins']['agl'] = 'https://alexgamelab.ru'
          config['production'] = True
          path.write_text(json.dumps(config, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          python3 site/build.py
          python3 site/tools/check_site.py

          # Publish both from main/(root) and, when enabled, GitHub Actions.
          cp -a site/dist/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site assets index.html 404.html privacy projects robots.txt sitemap.xml .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Import and build personal website for akaalexey.ru"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload personal website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
